name: Build post index
on:
  workflow_dispatch:
  push:
    paths: ['posts/*.md', 'scripts/**']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install markdown
      - run: python3 scripts/build-index.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posts/posts.json blog sitemap.xml
          git diff --staged --quiet || (git commit -m "Update post index and pages" && git push)
